# Ported from Trauma-Station
# Uses HumanoidAppearance instead of HumanoidProfile (Trauma-specific component)
- type: entityCondition
  id: IsHumanoid
  condition: !type:WhitelistCondition
    whitelist:
      components:
      - HumanoidAppearance
    guidebookText: entity-condition-guidebook-is-humanoid

# Capibara - referenced by genetics mutations; was silently ignored by the old NestedCondition stub.
- type: entityCondition
  id: IsAwake
  condition: !type:MobStateCondition
    mobstate: Alive
