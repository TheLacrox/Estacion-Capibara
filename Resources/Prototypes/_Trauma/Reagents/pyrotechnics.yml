# Methanol is required by the Goobstation Formaldehyde recipe in
# _Goobstation/Recipes/Reactions/medicine.yml. The other pyrotechnic reagents
# (Hexamine, Cyclonite, ANFO, Octogen) and their recipes are not ported —
# they depend on a full explosives rework that hasn't been brought over.

- type: reagent
  id: Methanol
  name: reagent-name-methanol
  group: Pyrotechnic
  desc: reagent-desc-methanol
  physicalDesc: reagent-physical-desc-pungent
  color: "#c4f5ff"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types: # methanol is bad for your health
            Poison: 3
