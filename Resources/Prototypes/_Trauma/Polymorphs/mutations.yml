- type: polymorph
  id: MutationMonkey
  configuration:
    entity: MobMonkey
    transferName: true
    componentsToTransfer: [] # Prevents language transfer
    forced: true
    revertOnCrit: false
    revertOnDeath: false

    inventory: Transfer
    polymorphSound: /Audio/Animals/monkey_scream.ogg

- type: polymorph
  id: MutationHuman
  configuration:
    entity: MobHuman
    transferName: true # human named monkey (MK-28) kino
    # yes language so monkey is still forced to speak monkey
    forced: true
    revertOnCrit: false
    revertOnDeath: false

    inventory: Transfer
    polymorphSound: /Audio/Voice/Human/malescream_1.ogg

