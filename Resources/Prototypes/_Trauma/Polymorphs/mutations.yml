- type: polymorph
  id: VoidMagnet
  configuration:
    entity: VoidMagnetPocket
    transferName: false
    inventory: None
    forced: true # Player must wait for duration to expire
    revertOnDeath: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 10
    effectProto: EffectDesynchronizer # TODO: make a more evil one
