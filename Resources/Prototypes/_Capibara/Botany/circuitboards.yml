# Capibara - Botany Machine Circuit Boards

# Seed Analyzer — basic, no special parts
- type: entity
  id: CapibaraSeedAnalyzerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: plant seed analyzer machine board
  description: A machine printed circuit board for a plant seed analyzer.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: CapibaraSeedAnalyzer
    stackRequirements:
      Manipulator: 1
      Glass: 2

# DNA Manipulator — mid-tier, needs manipulators
- type: entity
  id: CapibaraDnaManipulatorMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: plant DNA manipulator machine board
