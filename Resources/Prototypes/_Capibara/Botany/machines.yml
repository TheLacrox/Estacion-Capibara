# Capibara - Botany Machine Prototypes

- type: entity
  id: CapibaraSeedAnalyzer
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: plant seed analyzer
  description: Analyzes the genetic composition of seeds and produce. Insert a seed packet or produce to view its genome.
  components:
  - type: SeedAnalyzer
    seedSlot:
      name: capibara-seed-analyzer-slot
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Seed
        - Produce
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      SeedAnalyzer-seed: !type:ContainerSlot {}
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: _Capibara/Botany/Machines/seed_analyzer.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: ActivatableUI
    key: enum.SeedAnalyzerUiKey.Key
    singleUser: true
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.SeedAnalyzerUiKey.Key:
        type: SeedAnalyzerBoundUserInterface
  - type: Anchorable
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Repairable
    doAfterDelay: 8
  - type: Machine
    board: CapibaraSeedAnalyzerMachineCircuitboard
  - type: GuideHelp
    guides:
    - Botany

# DNA Manipulator
- type: entity
  id: CapibaraDnaManipulator
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: plant DNA manipulator
  description: Extracts and inserts plant genes using gene disks. The core tool of advanced botany.
  components:
  - type: DnaManipulator
    seedSlot:
      name: capibara-dna-manipulator-seed-slot
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Seed
    diskSlot:
      name: capibara-dna-manipulator-disk-slot
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - GeneDisk
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      DnaManipulator-seed: !type:ContainerSlot {}
      DnaManipulator-disk: !type:ContainerSlot {}
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: _Capibara/Botany/Machines/dna_manipulator.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: ActivatableUI
    key: enum.DnaManipulatorUiKey.Key
    singleUser: true
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DnaManipulatorUiKey.Key:
        type: DnaManipulatorBoundUserInterface
  - type: Anchorable
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Repairable
    doAfterDelay: 8
  - type: Machine
    board: CapibaraDnaManipulatorMachineCircuitboard
  - type: GuideHelp
    guides:
    - Botany

# Gene Splicer
- type: entity
  id: CapibaraGeneSplicer
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: plant gene splicer
  description: Combines two plant gene disks to create a new, more powerful gene. High failure chance on rare combinations.
  components:
  - type: GeneSplicer
    diskSlotA:
      name: capibara-gene-splicer-slot-a
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - GeneDisk
    diskSlotB:
      name: capibara-gene-splicer-slot-b
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - GeneDisk
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      GeneSplicer-diskA: !type:ContainerSlot {}
      GeneSplicer-diskB: !type:ContainerSlot {}
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: _Capibara/Botany/Machines/gene_splicer.rsi
    layers:
    - state: genesplicer_empty
    - state: genesplicer_screens
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: ActivatableUI
    key: enum.GeneSplicerUiKey.Key
    singleUser: true
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.GeneSplicerUiKey.Key:
        type: GeneSplicerBoundUserInterface
  - type: Anchorable
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Machine
    board: CapibaraGeneSplicerMachineCircuitboard
  - type: Repairable
    doAfterDelay: 8

