# Produce Mob (Passive) — sentient produce that wanders peacefully
- type: entity
  id: CapibaraProduceMobPassive
  parent: [ BaseSimpleMob, MobCombat, MobAtmosExposed, MobFlammable ]
  name: sentient produce
  description: A gene-modified plant product that has gained sentience.
  suffix: Passive
  components:
  - type: ProduceMob
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
    - state: produce
      sprite: Objects/Specific/Hydroponics/potato.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: Damageable
    damageContainer: Biological
  - type: Body
    bodyType: Simple
    prototype: Animal
  - type: Stamina
    critThreshold: 100
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 30
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: MobMover
  - type: Actions
  - type: Alerts
  - type: Appearance
  - type: CombatMode
  - type: StaticPrice
    price: 10

# Produce Mob (Hostile) — angry sentient produce that attacks
- type: entity
  id: CapibaraProduceMobHostile
  parent: CapibaraProduceMobPassive
  name: angry produce
  description: A gene-modified plant product that has gained sentience and is very angry.
  suffix: Hostile
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 5
  - type: NPCRetaliation
