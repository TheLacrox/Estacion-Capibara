# Capibara Station - production server config (baked into the Docker image).
# Per-deploy / secret values are injected at runtime via --cvar (see entrypoint.sh).

[log]
path = "logs"
level = 1
enabled = true

[net]
tickrate = 30
port = 1212
bindto = "::,0.0.0.0"
max_connections = 256

[status]
enabled = true
# status.connectaddress is set at runtime from $SS14_DOMAIN (udp://<domain>:1212)

[game]
# NOTE: hostname is overridden at runtime by $SS14_HOSTNAME (entrypoint.sh). Set
# SS14_HOSTNAME in Dokploy to this value, or the env wins over this baked default.
hostname = "[ES] Estacion Capibara 14 V2 [Español] [Traducido]"
lobbyenabled = true
soft_max_players = 50
role_timers = false
round_end_pvs_overrides = false
desc = """¡Bienvenido a Estacion Capibara 14! Servidor de habla hispana basado en Goob Station, \
con contenido personalizado incluyendo reactor nuclear y características de otros servidores. \
¡Únete a nuestra comunidad hispanohablante y disfruta de SS14 en español!"""
# map comes from the map pool (AtlasUpgraded)

[console]
# SECURITY: behind a reverse proxy, loopback == the proxy. Never grant loopback admin.
loginlocal = false
# Auto-grant full host (all admin flags) to this account on join. Safe ONLY with auth.mode=1
# (names tied to real SS14 accounts). Override per-deploy via $SS14_HOST_USER. Empty = disabled.
login_host_user = "TheLacrox"

[hub]
advertise = true
hub_urls = "https://hub.spacestation14.com/"
tags = "lang:es,region:es"
# hub.server_url is set at runtime from $SS14_DOMAIN (ss14s://<domain>)

[infolinks]
# Launcher "View server info" buttons (built-in icons for discord/web/wiki).
discord = "https://discord.gg/xRsRcpmCVX"
website = "https://estacioncapibara.com/"
wiki = "https://estacioncapibara.com/wiki"

[auth]
mode = 1   # 0=optional 1=required 2=disabled. Public server -> required.

[server]
# Periodic uptime auto-restart DISABLED (0 = off; engine default). Was 480 (8h).
# Re-enable by setting minutes > 0; when set it only fires at round end or when
# nobody is connected, and Docker (restart: unless-stopped) brings it back up.
uptime_restart_minutes = 0

[database]
engine = "sqlite"
sqlite_dbpath = "preferences.db"   # relative to --data-dir (/data) -> /data/preferences.db

[tts]
enabled = true
connection_string = "redis:6379"

[build]
fork_id = "capibara"   # launcher manages client ZIPs per fork
